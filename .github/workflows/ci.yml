name: CI / CD

on:
  push:
    branches: [develop, master]
  pull_request:
    branches: [master]

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository_owner }}/recsys

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements/base.txt
            requirements/dev.txt

      - name: Install dependencies
        run: |
          pip install \
            -r requirements/base.txt \
            -r requirements/dev.txt \
            -r requirements/recommendation_api.txt \
            -r requirements/stream_processor.txt \
            -r requirements/trainer.txt \
            -r requirements/event_generator.txt \
            fakeredis

      - name: Run tests
        run: pytest tests/ -v --cov=common --cov=services --cov-report=term-missing --cov-fail-under=55

  build:
    runs-on: ubuntu-latest
    needs: test
    outputs:
      image_tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Set image tag
        id: meta
        run: echo "tag=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Build all service images
        run: docker compose build

  publish:
    runs-on: ubuntu-latest
    needs: build
    # Only push images on commits to develop or master — not on PRs
    if: github.event_name == 'push'
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        service:
          - name: recommendation-api
            dockerfile: services/recommendation_api/Dockerfile
          - name: stream-processor
            dockerfile: services/stream_processor/Dockerfile
          - name: trainer
            dockerfile: services/trainer/Dockerfile
          - name: event-generator
            dockerfile: services/event_generator/Dockerfile
          - name: seeder
            dockerfile: services/seeder/Dockerfile
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.service.name }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.service.dockerfile }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-${{ matrix.service.name }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-${{ matrix.service.name }}:${{ github.ref_name }}
