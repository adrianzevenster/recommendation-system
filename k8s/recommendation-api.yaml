# Replace YOUR_ORG with your GitHub org, or use kustomize image overrides.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: recommendation-api
  namespace: recsys
  labels:
    app: recommendation-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: recommendation-api
  template:
    metadata:
      labels:
        app: recommendation-api
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: /metrics
    spec:
      initContainers:
        - name: migrate
          image: ghcr.io/YOUR_ORG/recsys-recommendation-api:latest
          command: ["alembic", "upgrade", "head"]
          envFrom:
            - configMapRef:
                name: recsys-config
            - secretRef:
                name: recsys-secrets
          env:
            - name: DATABASE_URL
              value: "postgresql+psycopg://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@$(POSTGRES_HOST):5432/$(POSTGRES_DB)"
      containers:
        - name: api
          image: ghcr.io/YOUR_ORG/recsys-recommendation-api:latest
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: recsys-config
            - secretRef:
                name: recsys-secrets
          env:
            - name: SERVICE_NAME
              value: recommendation-api
            - name: API_PORT
              value: "8000"
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 15
          resources:
            requests:
              memory: 256Mi
              cpu: 200m
            limits:
              memory: 512Mi
              cpu: 500m
---
apiVersion: v1
kind: Service
metadata:
  name: recommendation-api
  namespace: recsys
spec:
  selector:
    app: recommendation-api
  ports:
    - name: http
      port: 80
      targetPort: 8000
  type: ClusterIP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: recommendation-api
  namespace: recsys
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  rules:
    - host: recsys.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: recommendation-api
                port:
                  number: 80
